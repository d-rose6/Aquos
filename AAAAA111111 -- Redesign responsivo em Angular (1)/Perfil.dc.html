<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="_ds/modernist-3d05ecf9-fd52-4518-9d0e-14d66f9d2d02/styles.css">
<script src="_ds/modernist-3d05ecf9-fd52-4518-9d0e-14d66f9d2d02/_ds_bundle.js"></script>
<style>
  :root {
    --page-bg: #184a9a;
    --page-bg-2: #1e58ac;
    --page-ink: #eef1f6;
    --page-muted: rgba(238,241,246,.62);
    --page-rule: rgba(238,241,246,.34);
    --water: #3d97ff;
  }
  body { margin: 0; background: var(--page-bg); color: var(--page-ink); -webkit-font-smoothing: antialiased; }
  a { color: #9ec7ff; }
  a:hover { color: #c8dfff; }
  .hr { background: var(--page-rule); }
  .btn-secondary { border-color: var(--page-rule); color: var(--page-ink); }
  .btn-secondary:hover { background: rgba(238,241,246,.09); }
  .btn:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--page-ink); outline-offset: 2px; }
  ::selection { background: rgba(238,241,246,.28); }
</style>
</helmet>
<div style="min-height:100vh;background:var(--page-bg);color:var(--page-ink);font-family:var(--font-body)">

  <header style="position:sticky;top:0;z-index:5;background:var(--page-bg);border-bottom:2px solid var(--page-rule)">
    <div style="max-width:900px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px;min-height:56px">
      <a href="Dispositivos.dc.html" class="btn btn-secondary" style="width:44px;height:44px;padding:0;flex:none;justify-content:center;border-width:2px;text-decoration:none" aria-label="Voltar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M19 12H5"></path><path d="M12 19l-7-7 7-7"></path></svg>
      </a>
      <div style="min-width:0;flex:1;text-align:center">
        <div style="font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--page-muted)">Hidrômetro</div>
        <div style="font-family:var(--font-heading);font-weight:800;font-size:17px;line-height:1.15;letter-spacing:-.01em">Perfil</div>
      </div>
      <div style="width:44px;flex:none"></div>
    </div>
  </header>

  <main style="max-width:900px;margin:0 auto;padding:0 16px 56px">

    <section style="display:flex;flex-wrap:wrap;align-items:center;gap:16px;padding:28px 0 22px">
      <div style="width:72px;height:72px;flex:none;display:flex;align-items:center;justify-content:center;border:2px solid var(--page-rule);font-family:var(--font-heading);font-weight:800;font-size:26px">{{ initials }}</div>
      <div style="min-width:0">
        <h1 style="margin:0;font-size:clamp(26px,7vw,42px);line-height:1;letter-spacing:-.02em;text-transform:uppercase">{{ name }}</h1>
        <div style="margin-top:8px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--page-muted)">{{ deviceCountLabel }}</div>
      </div>
    </section>

    <hr class="hr" style="margin:0">

    <section style="padding:24px 0 26px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:20px;color:var(--page-muted)">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"></path></svg>
        <h6 style="margin:0;font-size:11px">Dados da conta</h6>
      </div>

      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px">
        <label style="display:block">
          <span style="display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--page-muted);margin-bottom:8px">Nome</span>
          <input type="text" value="{{ name }}" onChange="{{ onName }}" style="width:100%;min-height:48px;padding:0 14px;font-family:var(--font-body);font-size:16px;color:var(--page-ink);background:transparent;border:2px solid var(--page-rule);border-radius:0" style-focus="border-color:var(--page-ink)">
        </label>
        <label style="display:block">
          <span style="display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--page-muted);margin-bottom:8px">E-mail</span>
          <input type="email" value="{{ email }}" onChange="{{ onEmail }}" style="width:100%;min-height:48px;padding:0 14px;font-family:var(--font-body);font-size:16px;color:var(--page-ink);background:transparent;border:2px solid var(--page-rule);border-radius:0" style-focus="border-color:var(--page-ink)">
        </label>
      </div>

      <div style="display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:22px">
        <button type="button" class="btn" style="min-height:52px;justify-content:flex-start;gap:10px;padding:0 18px;font-size:15px;letter-spacing:.06em;text-transform:uppercase;background:var(--page-ink);color:var(--page-bg)" style-hover="background:#ffffff" onClick="{{ onSave }}">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M20 6L9 17l-5-5"></path></svg>
          Salvar alterações
        </button>
        <span style="font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--page-muted)">{{ savedLabel }}</span>
      </div>
    </section>

    <hr class="hr" style="margin:0">

    <section style="padding:24px 0 0">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;color:var(--page-muted)">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M9 21H5V3h14v6"></path><path d="M15 15h6"></path><path d="M18 12l3 3-3 3"></path></svg>
        <h6 style="margin:0;font-size:11px">Sessão</h6>
      </div>
      <button type="button" class="btn btn-secondary" style="min-height:48px;justify-content:flex-start;gap:10px;padding:0 18px;font-size:14px;letter-spacing:.06em;text-transform:uppercase;border-width:2px">
        Sair da conta
      </button>
    </section>

  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;userName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Marcos Ribeiro&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;userEmail&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;marcos.ribeiro@email.com&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;deviceCount&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:4,&quot;min&quot;:0,&quot;max&quot;:50,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  state = { name: null, email: null, saved: false };

  renderVals() {
    const name = this.state.name ?? this.props.userName ?? 'Marcos Ribeiro';
    const email = this.state.email ?? this.props.userEmail ?? 'marcos.ribeiro@email.com';
    return {
      name,
      email,
      initials: name.split(' ').filter(Boolean).slice(0, 2).map(p => p[0]).join('').toUpperCase(),
      deviceCountLabel: (this.props.deviceCount ?? 4) + ' dispositivos vinculados',
      savedLabel: this.state.saved ? 'Alterações salvas' : '',
      onName: e => this.setState({ name: e.target.value, saved: false }),
      onEmail: e => this.setState({ email: e.target.value, saved: false }),
      onSave: () => this.setState({ saved: true })
    };
  }
}
</script>
</body>
</html>
