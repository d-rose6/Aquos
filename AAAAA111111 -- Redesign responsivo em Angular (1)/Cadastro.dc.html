<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="_ds/modernist-3d05ecf9-fd52-4518-9d0e-14d66f9d2d02/styles.css">
<script src="_ds/modernist-3d05ecf9-fd52-4518-9d0e-14d66f9d2d02/_ds_bundle.js"></script>
<style>
  :root {
    --page-bg: #184a9a;
    --page-ink: #eef1f6;
    --page-muted: rgba(238,241,246,.62);
    --page-rule: rgba(238,241,246,.34);
    --water: #3d97ff;
  }
  body { margin: 0; background: var(--page-bg); color: var(--page-ink); -webkit-font-smoothing: antialiased; }
  a { color: #9ec7ff; }
  a:hover { color: #c8dfff; }
  .btn:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--page-ink); outline-offset: 2px; }
  input::placeholder { color: rgba(238,241,246,.42); }
  ::selection { background: rgba(238,241,246,.28); }
</style>
</helmet>
<div style="min-height:100vh;background:var(--page-bg);color:var(--page-ink);font-family:var(--font-body);display:flex;flex-direction:column">

  <main style="flex:1;width:100%;max-width:440px;margin:0 auto;padding:48px 20px 40px;box-sizing:border-box;display:flex;flex-direction:column">

    <div style="display:flex;align-items:center;gap:10px;margin-bottom:40px">
      <span style="width:12px;height:17px;background:var(--water);clip-path:polygon(50% 0%,100% 62%,78% 100%,22% 100%,0% 62%)"></span>
      <span style="font-family:var(--font-heading);font-weight:800;font-size:20px;letter-spacing:.02em">AQUOS</span>
    </div>

    <h1 style="margin:0 0 8px;font-size:clamp(32px,9vw,44px);line-height:1;letter-spacing:-.02em;text-transform:uppercase">{{ title }}</h1>
    <p style="margin:0 0 26px;font-size:14px;color:var(--page-muted)">{{ subtitle }}</p>

    <form onSubmit="{{ onSubmit }}" style="display:flex;flex-direction:column;gap:18px">

      <sc-if value="{{ isRegister }}" hint-placeholder-val="{{ false }}">
        <label style="display:block">
          <span style="display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--page-muted);margin-bottom:8px">Nome completo</span>
          <input type="text" autocomplete="name" placeholder="Seu nome" value="{{ name }}" onChange="{{ onName }}" style="width:100%;box-sizing:border-box;min-height:50px;padding:0 14px;font-family:var(--font-body);font-size:16px;color:var(--page-ink);background:transparent;border:2px solid var(--page-rule);border-radius:0" style-focus="border-color:var(--page-ink)">
        </label>
      </sc-if>

      <label style="display:block">
        <span style="display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--page-muted);margin-bottom:8px">E-mail</span>
        <input type="email" autocomplete="email" placeholder="voce@email.com" value="{{ email }}" onChange="{{ onEmail }}" style="width:100%;box-sizing:border-box;min-height:50px;padding:0 14px;font-family:var(--font-body);font-size:16px;color:var(--page-ink);background:transparent;border:2px solid var(--page-rule);border-radius:0" style-focus="border-color:var(--page-ink)">
      </label>

      <label style="display:block">
        <span style="display:flex;justify-content:space-between;gap:10px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--page-muted);margin-bottom:8px">
          <span>Senha</span>
          <sc-if value="{{ isLogin }}" hint-placeholder-val="{{ true }}"><a href="#" style="color:var(--page-ink);text-decoration:none" style-hover="text-decoration:underline">Esqueci a senha</a></sc-if>
        </span>
        <div style="position:relative">
          <input type="{{ pwType }}" autocomplete="current-password" placeholder="••••••••" value="{{ password }}" onChange="{{ onPassword }}" style="width:100%;box-sizing:border-box;min-height:50px;padding:0 56px 0 14px;font-family:var(--font-body);font-size:16px;color:var(--page-ink);background:transparent;border:2px solid var(--page-rule);border-radius:0" style-focus="border-color:var(--page-ink)">
          <button type="button" aria-label="Mostrar senha" onClick="{{ togglePw }}" style="position:absolute;right:2px;top:2px;bottom:2px;width:48px;display:flex;align-items:center;justify-content:center;border:0;background:transparent;color:var(--page-muted);cursor:pointer" style-hover="color:var(--page-ink)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          </button>
        </div>
      </label>

      <sc-if value="{{ isRegister }}" hint-placeholder-val="{{ false }}">
        <label style="display:block">
          <span style="display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--page-muted);margin-bottom:8px">Confirmar senha</span>
          <input type="{{ pwType }}" autocomplete="new-password" placeholder="••••••••" value="{{ confirm }}" onChange="{{ onConfirm }}" style="width:100%;box-sizing:border-box;min-height:50px;padding:0 14px;font-family:var(--font-body);font-size:16px;color:var(--page-ink);background:transparent;border:2px solid var(--page-rule);border-radius:0" style-focus="border-color:var(--page-ink)">
        </label>
      </sc-if>

      <sc-if value="{{ hasError }}" hint-placeholder-val="{{ false }}">
        <div style="padding:10px 14px;border:2px solid var(--color-accent-500);font-size:13px;color:#fff;background:rgba(236,48,19,.22)">{{ error }}</div>
      </sc-if>

      <button type="submit" class="btn" style="margin-top:6px;min-height:54px;justify-content:space-between;gap:10px;padding:0 18px;font-size:15px;letter-spacing:.06em;text-transform:uppercase;background:var(--page-ink);color:var(--page-bg)" style-hover="background:#ffffff" style-active="background:rgba(238,241,246,.82)" disabled="{{ busy }}">
        <span>{{ submitLabel }}</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M5 12h14"></path><path d="M12 5l7 7-7 7"></path></svg>
      </button>
    </form>

    <div style="margin-top:auto;padding-top:32px;font-size:13px;color:var(--page-muted)">
      {{ switchText }} <a href="{{ switchHref }}" style="color:var(--page-ink);font-weight:600">{{ switchLink }}</a>
    </div>

  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const AQ_KEY = 'aquos.devices';
const aqLoad = () => { try { return JSON.parse(localStorage.getItem(AQ_KEY)) || []; } catch (e) { return []; } };
const aqSave = list => { try { localStorage.setItem(AQ_KEY, JSON.stringify(list)); } catch (e) {} };
class Component extends DCLogic {
  state = { mode: null, name: '', email: '', password: '', confirm: '', showPw: false, error: '', busy: false };

  submit(e) {
    e.preventDefault();
    const reg = this.mode() === 'register';
    const { name, email, password, confirm } = this.state;
    let error = '';
    if (reg && !name.trim()) error = 'Informe seu nome.';
    else if (!/^\S+@\S+\.\S+$/.test(email)) error = 'Informe um e-mail válido.';
    else if (password.length < 6) error = 'A senha precisa ter pelo menos 6 caracteres.';
    else if (reg && password !== confirm) error = 'As senhas não coincidem.';
    if (error) return this.setState({ error });
    this.setState({ error: '', busy: true });
    setTimeout(() => { window.location.href = (reg || aqLoad().length === 0) ? 'Novo Dispositivo.dc.html' : 'Dispositivos.dc.html'; }, 900);
  }

  mode() { return 'register'; }
  setMode(mode) { this.setState({ mode, error: '' }); }

  renderVals() {
    const reg = this.mode() === 'register';
    const on = { bg: 'var(--page-ink)', fg: 'var(--page-bg)' };
    const off = { bg: 'transparent', fg: 'var(--page-ink)' };
    return {
      isRegister: reg,
      isLogin: !reg,
      title: reg ? 'Criar conta' : 'Entrar',
      subtitle: reg ? 'Cadastre-se para acompanhar seus hidrômetros.' : 'Acesse seus dispositivos e o consumo em tempo real.',
      tabLoginBg: reg ? off.bg : on.bg, tabLoginFg: reg ? off.fg : on.fg,
      tabRegBg: reg ? on.bg : off.bg, tabRegFg: reg ? on.fg : off.fg,
      submitLabel: this.state.busy ? 'Aguarde…' : (reg ? 'Criar conta' : 'Entrar'),
      switchText: reg ? 'Já tem conta?' : 'Ainda não tem conta?',
      switchLink: reg ? 'Entrar' : 'Criar conta',
      switchHref: reg ? 'Login.dc.html' : 'Cadastro.dc.html',
      name: this.state.name, email: this.state.email, password: this.state.password, confirm: this.state.confirm,
      pwType: this.state.showPw ? 'text' : 'password',
      hasError: !!this.state.error, error: this.state.error,
      busy: this.state.busy,
      toLogin: () => this.setMode('login'),
      toRegister: () => this.setMode('register'),
      onSwitch: e => { e.preventDefault(); this.setMode(reg ? 'login' : 'register'); },
      togglePw: () => this.setState(s => ({ showPw: !s.showPw })),
      onName: e => this.setState({ name: e.target.value }),
      onEmail: e => this.setState({ email: e.target.value }),
      onPassword: e => this.setState({ password: e.target.value }),
      onConfirm: e => this.setState({ confirm: e.target.value }),
      onSubmit: e => this.submit(e)
    };
  }
}
</script>
</body>
</html>
